name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install pandoc 3.8 and CJK fonts
        run: |
          curl -sL -o /tmp/pandoc.deb https://github.com/jgm/pandoc/releases/download/3.8/pandoc-3.8-1-amd64.deb
          sudo dpkg -i /tmp/pandoc.deb
          sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
          pandoc --version | head -1

      - name: Install Python dependencies
        run: python -m pip install -r templates/shared/requirements.txt pytest "matplotlib==3.10.6"

      - name: Run test suite
        run: python -m pytest tests -q -p no:cacheprovider
